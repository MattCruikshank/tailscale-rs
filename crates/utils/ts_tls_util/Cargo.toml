[package]
name = "ts_tls_util"
version.workspace = true
description = "tailscale-specific tls utilities"
categories = ["network-programming", "asynchronous", "cryptography"]
keywords = ["tailscale", "network", "tls", "ssl"]

repository.workspace = true
edition.workspace = true
license.workspace = true

rust-version.workspace = true

[dependencies]
# Unconditionally required dependencies.
tokio.workspace = true
tracing.workspace = true
url.workspace = true
webpki-roots = { version = "1.0" }

# aws-lc (C + asm) can't be built for Hermit, which can't link C code; use a pure-Rust
# RustCrypto provider there instead.
[target.'cfg(not(target_os = "hermit"))'.dependencies]
tokio-rustls = { version = "0.26", default-features = false, features = ["aws-lc-rs"] }

[target.'cfg(target_os = "hermit")'.dependencies]
tokio-rustls = { version = "0.26", default-features = false, features = ["tls12"] }
rustls-rustcrypto = "0.0.2-alpha"

[features]
# enable the connect_insecure function, which doesn't validate tls certs
insecure = []

[lints]
workspace = true
